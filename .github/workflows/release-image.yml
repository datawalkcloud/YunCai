name: 发布镜像到阿里云 ACR

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: 构建 ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yuncai-api
            target: api
          - image: yuncai-web
            target: web
    steps:
      - uses: actions/checkout@v4

      - name: 校验 ACR 配置
        env:
          REGISTRY: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          NAMESPACE: ${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}
        run: |
          : "${REGISTRY:?缺少 ACR_REGISTRY（Repository variables 或 secrets）}"
          : "${NAMESPACE:?缺少 ACR_NAMESPACE（Repository variables 或 secrets）}"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # ACR 对 OCI attestation 的支持因版本而异，关掉更稳。
          provenance: false
