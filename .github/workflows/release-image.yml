name: 发布镜像到阿里云 ACR

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: 构建 ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yuncai-api
            target: api
          - image: yuncai-web
            target: web
    steps:
      - uses: actions/checkout@v4

      - name: 校验并规范化 ACR 配置
        id: acr
        env:
          RAW_REGISTRY: ${{ vars.ACR_REGISTRY || secrets.ACR_REGISTRY }}
          RAW_NAMESPACE: ${{ vars.ACR_NAMESPACE || secrets.ACR_NAMESPACE }}
        run: |
          : "${RAW_REGISTRY:?缺少 ACR_REGISTRY（Repository variables 或 secrets）}"
          : "${RAW_NAMESPACE:?缺少 ACR_NAMESPACE（Repository variables 或 secrets）}"
          registry="${RAW_REGISTRY#https://}"; registry="${registry#http://}"; registry="${registry%/}"
          registry=$(printf '%s' "$registry" | tr 'A-Z' 'a-z' | sed -e 's/[[:space:]]//g' -e 's/\.$//' -e 's/:443$//' -e 's/:80$//')
          namespace=$(printf '%s' "$RAW_NAMESPACE" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's|/$||')
          case "$registry" in
            */*) echo "::error::ACR_REGISTRY 只填域名，不要带命名空间或路径"; exit 1;;
            registry-vpc.*|*-vpc.*|*-internal.*) echo "::error::这是 VPC/内网地址，GitHub 托管 runner 无法访问，请换成公网域名"; exit 1;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$registry/v2/" || true)
          echo "https://$registry/v2/ → HTTP $code（预期 401 表示域名可达）"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 诊断 ACR 鉴权
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          registry='${{ steps.acr.outputs.registry }}'
          namespace='${{ steps.acr.outputs.namespace }}'
          user=$(printf '%s' "$ACR_USERNAME" | tr -d '\r\n')
          pass=$(printf '%s' "$ACR_PASSWORD" | tr -d '\r\n')
          challenge=$(curl -sS -o /dev/null -D - "https://$registry/v2/" | tr -d '\r' | awk -F': ' 'tolower($1)=="www-authenticate"{print $2}')
          realm=$(printf '%s' "$challenge" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
          service=$(printf '%s' "$challenge" | sed -n 's/.*service="\([^"]*\)".*/\1/p')
          echo "token 服务：${realm:-（未取到）} service=${service:-（无）}"
          [ -n "$realm" ] || { echo "::warning::未取到鉴权挑战，跳过诊断"; exit 0; }
          resp=$(curl -sS -u "$user:$pass" -w '\n%{http_code}' "$realm?service=${service}&scope=repository:${namespace}/${{ matrix.image }}:pull,push")
          token_code=$(printf '%s' "$resp" | tail -n1)
          token_body=$(printf '%s' "$resp" | sed '$d')
          echo "取 token → HTTP $token_code"
          case "$registry" in
            *.cr.aliyuncs.com) echo "注册表类型：企业版实例域名";;
            registry.*.aliyuncs.com) echo "注册表类型：个人版域名";;
            *) echo "注册表类型：非阿里云标准域名（自定义域名？）";;
          esac
          token=$(printf '%s' "$token_body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null || true)
          if [ -n "$token" ]; then
            code=$(curl -s -o /tmp/acr_basic -w '%{http_code}' -u "$user:$pass" "https://$registry/v2/")
            echo "GET /v2/（Basic）→ HTTP $code"; head -c 300 /tmp/acr_basic; echo
            code=$(curl -s -o /tmp/acr_bearer -w '%{http_code}' -H "Authorization: Bearer $token" "https://$registry/v2/")
            echo "GET /v2/（Bearer）→ HTTP $code"; head -c 300 /tmp/acr_bearer; echo
            code=$(curl -s -o /tmp/acr_tags -w '%{http_code}' -H "Authorization: Bearer $token" "https://$registry/v2/${namespace}/${{ matrix.image }}/tags/list")
            echo "GET 仓库 tags（Bearer）→ HTTP $code"; head -c 300 /tmp/acr_tags; echo
          else
            echo "未取到 access_token"; head -c 300 <<<"$token_body"; echo
          fi

      - name: 登录 ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          : "${ACR_USERNAME:?缺少 ACR_USERNAME}"
          : "${ACR_PASSWORD:?缺少 ACR_PASSWORD}"
          # 复制进 Secrets 时容易带上换行或首尾空格，先剔掉再登录
          user=$(printf '%s' "$ACR_USERNAME" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          pass=$(printf '%s' "$ACR_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          printf '%s' "$pass" | docker login "${{ steps.acr.outputs.registry }}" --username "$user" --password-stdin

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr.outputs.registry }}/${{ steps.acr.outputs.namespace }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # ACR 对 OCI attestation 的支持因版本而异，关掉更稳。
          provenance: false
