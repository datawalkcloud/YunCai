apiVersion: apps/v1
kind: Deployment
metadata:
  name: yuncai-web
  labels:
    app: yuncai-web
spec:
  # 纯静态 SPA + nginx 反代，无状态，可随意扩。
  replicas: 2
  selector:
    matchLabels:
      app: yuncai-web
  template:
    metadata:
      labels:
        app: yuncai-web
    spec:
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: web
          image: yuncai-web
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
