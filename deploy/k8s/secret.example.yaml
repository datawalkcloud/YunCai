# 示例文件，不要直接提交真实口令。
# 推荐用 README 里的 kubectl create secret 命令创建 yuncai-secret，
# 或复制本文件改好值后 kubectl apply -f secret.example.yaml。
apiVersion: v1
kind: Secret
metadata:
  name: yuncai-secret
type: Opaque
stringData:
  # 集群内 PostgreSQL：Host=db；用云数据库时改成实际地址（端口/sslmode 按服务商要求补）。
  ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=yuncai_pro;Username=yuncai;Password=CHANGE_ME
  # 至少 32 位随机串：openssl rand -base64 48 | tr -d '/+='
  Jwt__Key: dajkeqgjhegjhgdajhteiqugeqgueqg
  # 仅在 YunCai__Seed__Enabled=true 时使用
  YunCai__Seed__AdminPassword: HANgui0127
