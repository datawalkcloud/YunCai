server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 凭证 / 科目 / 流水导入的 Excel 体积上限，与后端 Kestrel 默认 30MB 相当。
    client_max_body_size 32m;

    # 带内容哈希的构建产物可以长缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 站点运行时配置必须实时生效：私有化部署改完 site.config.js 后刷新即读到最新值。
    location = /site.config.js {
        add_header Cache-Control "no-cache";
    }

    # 前端统一以 /api 前缀请求后端；结尾的 / 会剥掉 /api 前缀，与 Vite 开发代理行为一致。
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    # 官网首页：直接返回纯静态 HTML（真实内容在标签里，利于 SEO 抓取），不进 SPA。
    location = / {
        try_files /home.html =404;
    }

    # SPA 路由由前端接管，未知路径回落 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
